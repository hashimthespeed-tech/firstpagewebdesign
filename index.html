<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hashim Al Amin</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to top, #ffffff 0%, #86efac 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 { margin: 0 0 1.5rem 0; color: #222; }
    .birthday {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #6d28d9;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .birthday:hover { background: #5b21b6; }
    .birthday:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div>
    <h1>Hashim Al Amin</h1>
    <a class="birthday" href="https://www.cnbc.com/" target="_blank" rel="noopener noreferrer">
      🎂 Birthday: 09/22/2009
    </a>
  </div>
</body>
</html>
